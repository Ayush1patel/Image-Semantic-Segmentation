# UAVScenes vanilla-UNet — 19-class / 256x256 — CE + Lovasz-Softmax loss variant
# Sibling of ../unet_dice_ce, identical in every respect
# except the loss function:
#   unet_dice_ce:            0.5 Dice   + 0.5 class-weighted CE
#   unet_lovasz_ce:  0.5 Lovasz-Softmax + 0.5 class-weighted CE
# Same architecture, optimizer, LR schedule, batch size, epochs, seed,
# class taxonomy, resolution, and train/val/test split (data_index/ was
# copied verbatim, not rebuilt -- the split hasn't changed).
# See src/losses.py (CELovaszLoss) for the reasoning behind the swap.

data:
  height: 256
  width: 256
  num_workers: 8       # ignored: cache_in_ram forces num_workers=0 (see train.py)
  cache_in_ram: true    # ~4.2GB for train+val combined at 256x256, fits comfortably in RAM

model:
  encoder_name: resnet34
  encoder_weights: imagenet

train:
  batch_size: 32
  epochs: 100
  lr: 0.0003
  weight_decay: 0.0001
  warmup_epochs: 3
  lovasz_weight: 0.5   # replaces dice_weight from the sibling project's config
  ce_weight: 0.5
  class_weight_clip_max: 10.0
  grad_clip_norm: 5.0
  amp: true
  early_stop_patience: 15
  val_every: 1
  seed: 42
  num_progress_images: 10
  results_dir: results_256
